[project]
name = "zero-trust-admission-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 单测过程中 zero_trust_admission logger 会打印"准入判定输入"与
# "准入判定依据"；捕获式日志在测试失败时随断言报告输出，必要时可通过
# --log-cli-level=INFO 实时查看。
log_cli = false
log_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_level = "INFO"
testpaths = "tests"
addopts = "-ra"
