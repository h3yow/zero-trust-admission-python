[project]
name = "zero-trust-admission-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 单测过程中 zero_trust_admission logger 会打印"准入判定输入"与
# "准入判定依据"；捕获式日志在测试失败时随断言报告输出，必要时可通过
# --log-cli-level=INFO 实时查看。
log_cli = false
log_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_level = "INFO"
testpaths = "tests"
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# 静态检查基线：逻辑错误（F/pyflakes）、导入与 __all__ 排序（I/RUF022）、
# 现代化改写（UP）与常用简化（SIM）
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "RUF022"]
# SIM115（open 需用上下文管理器）对刻意长开句柄的审计 sink 不适用；
# SIM103 会牺牲"早返回守卫"的可读性；UP042 要求改用 StrEnum，
# 项目刻意保持 (str, Enum) 显式写法
ignore = ["SIM115", "SIM103", "UP042"]
